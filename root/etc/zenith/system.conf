# ZenithOS system configuration. Settings and the installer write this file;
# it can also be edited by hand.
language=en
keyboard=us
timezone=UTC
# 1 when the hardware clock keeps local time (as Windows does), 0 for UTC
rtc_local=0
# network time: synchronise the clock after the network comes up
ntp=1
ntp_server=pool.ntp.org
# password hashing cost
pbkdf2_iterations=30000
# apps pinned in the taskbar and in the start menu (ids of the .zapp files);
# users can override these in their own settings
taskbar_pinned=files,terminal,editor,sysmon,browser,store,settings
startmenu_pinned=files,terminal,editor,browser,store,settings,sysmon,demo3d,mandel,tetris,snake,chess,mines,2048,piano,paint,calc,clock,images
# graphics: "auto" (use a driver package for the graphics adapter if the package sources have one, otherwise the
# firmware's UEFI GOP display), "driver" (same, chosen at installation) or "gop" (never load a driver)
graphics=auto
# debugging aids for the System V program interface (both off by default)
#   abi_trace=1   log every system call a program makes, abi_trace=2 only the process and thread ones
#   abi_echo=1    copy everything programs print to the serial log
